    // not start, load the page once more (the service worker then checks every
    // file with the server). Only once, so a real fault cannot loop.

      if (window.__plusespotStarted) return;
      var message = String((event && event.message) || '');
      if (!/SyntaxError|import|export|module/i.test(message)) return;
      try {
        if (sessionStorage.getItem('plusespot.reloaded')) return;
        sessionStorage.setItem('plusespot.reloaded', '1');
      } catch (e) { return; }
      location.reload();
    });
