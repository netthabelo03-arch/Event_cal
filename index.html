<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>plusespot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/theme/tokens.css">
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
  <div class="shell">
    <!-- Decorative moving panel beside the sign-in screens on big screens. -->
    <aside class="showcase" aria-hidden="true">
      <span class="showcase__glow showcase__glow--one"></span>
      <span class="showcase__glow showcase__glow--two"></span>
      <span class="showcase__glow showcase__glow--three"></span>
      <div class="showcase__copy">
        <p class="showcase__title">Never miss what's on.</p>
        <p class="showcase__text">Short event clips. Reminders. Tickets.</p>
      </div>
    </aside>
    <main id="app" class="app" tabindex="-1"></main>
  </div>
  <noscript>plusespot needs JavaScript to run.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
